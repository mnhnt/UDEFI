name: Build UDEFI All-in-One EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile C# Core
        run: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /optimize /r:System.Management.dll /out:udefi_core.exe udefi_core.cs
      - name: Download Portable Tools
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path tools
          
          $cdiUrl = (Invoke-RestMethod -Uri "https://github.com").assets | Where-Object { $_.name -like "CrystalDiskInfo*.zip" -and $_.name -notlike "*Aoi*" -and $_.name -notlike "*Shizuku*" } | Select-Object -First 1 -ExpandProperty browser_download_url
          if ($cdiUrl) {
            curl.exe -L -s -o tools\cdi.zip $cdiUrl
            Expand-Archive -Path tools\cdi.zip -DestinationPath tools\cdi -Force -ErrorAction SilentlyContinue
            Get-ChildItem -Path tools\cdi -Filter "DiskInfo64.exe" -Recurse | Copy-Item -Destination tools\cdi.exe -Force
          }

          winget download --id CPUID.CPU-Z -d tools\cpuz_dl --accept-package-agreements --accept-source-agreements
          $cpuzExe = Get-ChildItem -Path tools\cpuz_dl -Filter "*.exe" | Select-Object -First 1
          if ($cpuzExe) { Copy-Item $cpuzExe.FullName -Destination tools\cpuz.exe -Force }

          winget download --id TechPowerUp.GPU-Z -d tools\gpuz_dl --accept-package-agreements --accept-source-agreements
          $gpuzExe = Get-ChildItem -Path tools\gpuz_dl -Filter "*.exe" | Select-Object -First 1
          if ($gpuzExe) { Copy-Item $gpuzExe.FullName -Destination tools\gpuz.exe -Force }

          Remove-Item tools\*.zip, tools\cdi, tools\cpuz_dl, tools\gpuz_dl -Recurse -Force -ErrorAction SilentlyContinue
      - name: Install Python Deps
        run: pip install pyinstaller pywebview pillow
      - name: Generate Icon
        run: python -c "from PIL import Image, ImageDraw; img=Image.new('RGBA',(256,256),(0,0,0,0)); d=ImageDraw.Draw(img); d.rounded_rectangle((16,16,240,240),48,fill='#0D0D0D',outline='#FF6D00',width=12); d.arc((56,56,200,200),start=150,end=30,fill='#FF6D00',width=24); img.save('udefi.ico')"
      - name: Build Hybrid EXE
        run: pyinstaller --noconsole --onefile --icon=udefi.ico --add-data "ui.html;." --add-binary "udefi_core.exe;." --add-data "tools;tools" --name UDEFI udefi.py
      - uses: actions/upload-artifact@v4
        with:
          name: UDEFI_AllInOne_Windows
          path: dist/UDEFI.exe
