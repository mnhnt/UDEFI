name: Build UDEFI EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --noconsole --onefile --collect-all tkinter --name UDEFI udefi.py
      - uses: actions/upload-artifact@v4
        with:
          name: UDEFI_Windows_x64
          path: dist/UDEFI.exe
